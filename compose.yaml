services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: witness
      POSTGRES_USER: witness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U witness -d witness"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://witness:${POSTGRES_PASSWORD}@db:5432/witness
      DATA_DIR: /data
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
  uploads:
